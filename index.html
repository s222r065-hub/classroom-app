/* ============================================================
   計算ロジック（仕様書 8〜9章）
   ============================================================ */

function extraExpenseTotal(e) {
  return (e.customExpenses || []).reduce((s, c) => s + (Number(c.amount) || 0), 0);
}
function calcBaseRevenue(e) {
  return (Number(e.participationFee) || 0) * (Number(e.participants) || 0);
}
function calcTotalRevenue(e) {
  return calcBaseRevenue(e) + (Number(e.otherRevenue) || 0);
}
function calcTotalExpenses(e) {
  return (
    (Number(e.instructorFee) || 0) +
    (Number(e.venueCost) || 0) +
    (Number(e.materialCost) || 0) +
    (Number(e.advertisingCost) || 0) +
    (Number(e.equipmentCost) || 0) +
    (Number(e.otherExpense) || 0) +
    extraExpenseTotal(e)
  );
}
function calcProfit(e) {
  return calcTotalRevenue(e) - calcTotalExpenses(e);
}
function calcProfitMargin(e) {
  const r = calcTotalRevenue(e);
  if (r === 0) return null;
  return (calcProfit(e) / r) * 100;
}
function calcOccupancy(e) {
  const cap = Number(e.capacity) || 0;
  if (cap === 0) return null;
  return ((Number(e.participants) || 0) / cap) * 100;
}
function calcRevenuePerParticipant(e) {
  const p = Number(e.participants) || 0;
  if (p === 0) return null;
  return calcTotalRevenue(e) / p;
}
function calcProfitPerParticipant(e) {
  const p = Number(e.participants) || 0;
  if (p === 0) return null;
  return calcProfit(e) / p;
}
function calcBreakEven(e) {
  const fee = Number(e.participationFee) || 0;
  const fixed = calcTotalExpenses(e) - (Number(e.otherRevenue) || 0) * 0; // MVP: 全経費を固定費として扱う
  const fixedCosts = calcTotalExpenses(e);
  if (fee <= 0) return { status: "unknown" };
  const needed = Math.ceil(fixedCosts / fee);
  const cap = Number(e.capacity) || Infinity;
  if (calcProfit(e) > 0) return { status: "already", needed: 0 };
  if (needed > cap) return { status: "impossible", needed };
  return { status: "needed", needed, gap: Math.max(0, needed - (Number(e.participants) || 0)) };
}
function statusOf(e) {
  const p = calcProfit(e);
  if (p > 0) return "黒字";
  if (p < 0) return "赤字";
  return "損益分岐";
}
function statusColor(status) {
  if (status === "黒字") return { text: "text-emerald-700", bg: "bg-emerald-50", border: "border-emerald-300", dot: "bg-emerald-500" };
  if (status === "赤字") return { text: "text-rose-700", bg: "bg-rose-50", border: "border-rose-300", dot: "bg-rose-500" };
  return { text: "text-amber-700", bg: "bg-amber-50", border: "border-amber-300", dot: "bg-amber-500" };
}

async function loadRecords() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (err) {
    // 初回起動、またはストレージ読み取り不可
  }
  return null;
}
async function saveRecords(records) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (err) {
    console.error("保存に失敗しました", err);
    return false;
  }
}

   自動分析・改善ポイント（14〜15章）

function buildAutoAnalysis(records, entry, prevEntry) {
  const notes = [];
  const occ = calcOccupancy(entry);
  const margin = calcProfitMargin(entry);
  const be = calcBreakEven(entry);

  if (prevEntry) {
    const prevP = Number(prevEntry.participants) || 0;
    if (prevP > 0) {
      const diff = ((entry.participants - prevP) / prevP) * 100;
      if (Math.abs(diff) >= 5) {
        notes.push(`参加人数が前月比${diff >= 0 ? diff.toFixed(0) + "%増加" : Math.abs(diff).toFixed(0) + "%減少"}しています。`);
      }
    }
  }
  if (occ !== null && occ >= 85) {
    notes.push(`${entry.className}は定員充足率${occ.toFixed(0)}%で、非常に高い参加率です。`);
  } else if (occ !== null && occ < 40) {
    notes.push(`${entry.className}は参加率が${occ.toFixed(0)}%に留まっており、集客改善の余地があります。`);
  }
  if (calcProfit(entry) < 0) {
    if (be.status === "needed") {
      notes.push(`${entry.className}は現在赤字です。あと${be.gap}名の参加で損益分岐点に到達します。`);
    } else if (be.status === "impossible") {
      notes.push(`${entry.className}は現在赤字で、定員内では黒字化できません。参加費や経費の見直しが必要です。`);
    } else {
      notes.push(`${entry.className}は現在赤字です。参加人数・参加費・経費のバランスを確認してください。`);
    }
  }
  if (prevEntry) {
    const prevP = Number(prevEntry.participants) || 0;
    const prevMargin = calcProfitMargin(prevEntry);
    if (entry.participants > prevP && margin !== null && prevMargin !== null && margin < prevMargin - 3) {
      notes.push(`${entry.className}は参加人数が増加している一方、利益率が低下しています。支出の増加を確認してください。`);
    }
  }
  return notes;
}

function buildImprovementPoints(entry, decliningStreak) {
  const points = [];
  const occ = calcOccupancy(entry);
  const margin = calcProfitMargin(entry);
  const profit = calcProfit(entry);

  if (occ !== null && occ < 50) {
    points.push({ type: "warn", text: "定員充足率が低いため、集客施策を検討してください。" });
  }
  if (occ !== null && occ >= 80) {
    points.push({ type: "good", text: "参加率が高いため、定員増加や開催回数増加を検討できる可能性があります。" });
  }
  if (profit < 0) {
    points.push({ type: "bad", text: "赤字となっています。参加人数・参加費・経費の見直しを検討してください。" });
  }
  if (decliningStreak >= 2) {
    points.push({ type: "warn", text: "参加人数が継続的に減少しています。" });
  }
  if (margin !== null && margin >= 40) {
    points.push({ type: "good", text: "収益性の高い教室です。類似教室への展開を検討できます。" });
  }
  return points;
}

   ============================================================ */

const NAV_ITEMS = [
  { key: "dashboard", label: "ダッシュボード", icon: LayoutDashboard },
  { key: "list", label: "教室一覧", icon: ListChecks },
  { key: "entry", label: "データ入力", icon: PlusCircle },
  { key: "analysis", label: "分析", icon: BarChart3 },

  { key: "settings", label: "設定", icon: Settings },
];

/* ============================================================
   メインアプリ
   ============================================================ */

function App() {
  const [records, setRecords] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [page, setPage] = useState("dashboard");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null); // データ入力画面で編集中のレコード
  const [selectedClassName, setSelectedClassName] = useState(null); // 詳細ページ
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved

  const [filters, setFilters] = useState({
    fiscalYear: "all", month: "all", className: "all", category: "all", instructor: "all",
  });
  const [search, setSearch] = useState("");

  // 初回ロード
  useEffect(() => {
    (async () => {
      const stored = await loadRecords();
      if (stored && Array.isArray(stored) && stored.length > 0) {
        setRecords(stored);
      } else {
        const sample = buildSampleData();
        setRecords(sample);
        await saveRecords(sample);
      }
      setLoaded(true);
    })();
  }, []);

  // 変更を保存
  const persist = useCallback(async (next) => {
    setSaveState("saving");
    const ok = await saveRecords(next);
    setSaveState(ok ? "saved" : "idle");
    if (ok) setTimeout(() => setSaveState("idle"), 1500);
  }, []);

  const updateRecords = useCallback((updater) => {
    setRecords((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      persist(next);
      return next;
    });
  }, [persist]);

  const allClassNames = useMemo(() => Array.from(new Set(records.map((r) => r.className))).sort(), [records]);
  const allInstructors = useMemo(() => Array.from(new Set(records.map((r) => r.instructor).filter(Boolean))).sort(), [records]);
  const allFiscalYears = useMemo(() => Array.from(new Set(records.map((r) => fiscalYearOf(r.year, r.month)))).sort(), [records]);

  const filteredRecords = useMemo(() => {
    return records.filter((r) => {
      if (filters.fiscalYear !== "all" && fiscalYearOf(r.year, r.month) !== Number(filters.fiscalYear)) return false;
      if (filters.month !== "all" && r.month !== Number(filters.month)) return false;
      if (filters.className !== "all" && r.className !== filters.className) return false;
      if (filters.category !== "all" && r.category !== filters.category) return false;
      if (filters.instructor !== "all" && r.instructor !== filters.instructor) return false;
      if (search.trim() && !r.className.includes(search.trim())) return false;
      return true;
    });
  }, [records, filters, search]);

  const goToEntry = (record) => {
    setEditingRecord(record || null);
    setPage("entry");
    setMobileNavOpen(false);
  };
  const goToDetail = (className) => {
    setSelectedClassName(className);
    setPage("detail");
  };

  const deleteRecord = (id) => {
    updateRecords((prev) => prev.filter((r) => r.id !== id));
  };

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50 text-slate-400 text-sm">
        読み込み中…
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900 flex" style={{ fontFamily: "'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" }}>
      {/* サイドバー（デスクトップ） */}
      <aside className="hidden md:flex md:flex-col w-60 shrink-0 bg-[#152030] text-slate-200 min-h-screen sticky top-0">
        <div className="px-5 py-5 border-b border-white/10">
          <div className="text-[15px] font-bold text-white leading-tight">教室収支<br />マネジメント</div>
          <div className="text-[11px] text-slate-400 mt-1">公共スポーツ施設向け</div>
        </div>
        <nav className="flex-1 px-3 py-4 flex flex-col gap-1">
          {NAV_ITEMS.map((item) => (
            <button
              key={item.key}
              onClick={() => { setPage(item.key); setEditingRecord(null); }}
              className={`flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                page === item.key || (page === "detail" && item.key === "list")
                  ? "bg-teal-600 text-white"
                  : "text-slate-300 hover:bg-white/5 hover:text-white"
              }`}
            >
              <item.icon size={17} />
              {item.label}
            </button>
          ))}
        </nav>
        <div className="px-5 py-4 border-t border-white/10 text-[11px] text-slate-500">
          {saveState === "saving" ? "保存中…" : saveState === "saved" ? "保存済み" : "自動保存"}
        </div>
      </aside>

      {/* モバイルヘッダー */}
      <div className="md:hidden fixed top-0 inset-x-0 z-30 bg-[#152030] text-white flex items-center justify-between px-4 h-14">
        <div className="font-bold text-sm">教室収支マネジメント</div>
        <button onClick={() => setMobileNavOpen((v) => !v)} className="p-1.5">
          <Menu size={22} />
        </button>
      </div>
      {mobileNavOpen && (
        <div className="md:hidden fixed inset-0 z-20 bg-black/40" onClick={() => setMobileNavOpen(false)}>
          <div className="absolute top-14 inset-x-0 bg-[#152030] text-slate-200 p-3 flex flex-col gap-1" onClick={(e) => e.stopPropagation()}>
            {NAV_ITEMS.map((item) => (
              <button
                key={item.key}
                onClick={() => { setPage(item.key); setEditingRecord(null); setMobileNavOpen(false); }}
                className={`flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-medium ${
                  page === item.key ? "bg-teal-600 text-white" : "text-slate-300 hover:bg-white/5"
                }`}
              >
                <item.icon size={17} />
                {item.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* メインコンテンツ */}
      <main className="flex-1 min-w-0 pt-14 md:pt-0">
        <div className="max-w-6xl mx-auto p-4 md:p-8">
          {records.length === 0 && page !== "entry" ? (
            <EmptyState onAdd={() => goToEntry(null)} />
          ) : (
            <>
              {page === "dashboard" && (
                <DashboardPage
                  records={records}
                  filteredRecords={filteredRecords}
                  filters={filters} setFilters={setFilters}
                  allClassNames={allClassNames} allInstructors={allInstructors} allFiscalYears={allFiscalYears}
                  onSelectClass={goToDetail}
                  onAdd={() => goToEntry(null)}
                />
              )}
              {page === "list" && (
                <ClassListPage
                  records={records} filteredRecords={filteredRecords}
                  filters={filters} setFilters={setFilters} search={search} setSearch={setSearch}
                  allClassNames={allClassNames} allInstructors={allInstructors} allFiscalYears={allFiscalYears}
                  onEdit={goToEntry} onDelete={deleteRecord} onSelectClass={goToDetail}
                  onAdd={() => goToEntry(null)}
                />
              )}
              {page === "entry" && (
                <EntryPage
                  editingRecord={editingRecord}
                  allClassNames={allClassNames} allInstructors={allInstructors}
                  onCancel={() => { setEditingRecord(null); setPage("list"); }}
                  onSave={(rec) => {
                    updateRecords((prev) => {
                      const exists = prev.some((r) => r.id === rec.id);
                      return exists ? prev.map((r) => (r.id === rec.id ? rec : r)) : [...prev, rec];
                    });
                    setEditingRecord(null);
                    setPage("list");
                  }}
                />
              )}
              {page === "analysis" && (
                <AnalysisPage
                  records={records} filteredRecords={filteredRecords}
                  filters={filters} setFilters={setFilters}
                  allClassNames={allClassNames} allInstructors={allInstructors} allFiscalYears={allFiscalYears}
                />
              )}
              {page === "simulation" && <SimulationPage records={records} allClassNames={allClassNames} />}
              {page === "settings" && (
                <SettingsPage
                  records={records}
                  onImport={(next) => updateRecords(next)}
                  onClearAll={() => updateRecords([])}
                />
              )}
              {page === "detail" && (
                <ClassDetailPage
                  className={selectedClassName}
                  records={records.filter((r) => r.className === selectedClassName).sort((a, b) => a.year - b.year || a.month - b.month)}
                  onBack={() => setPage("list")}
                  onEdit={goToEntry}
                />
              )}
            </>
          )}
        </div>
      </main>
    </div>
  );
}

  );

/* ============================================================
   集計ヘルパー
   ============================================================ */

function aggregateTotals(list) {
  const totalRevenue = list.reduce((s, e) => s + calcTotalRevenue(e), 0);
  const totalExpenses = list.reduce((s, e) => s + calcTotalExpenses(e), 0);
  const profit = totalRevenue - totalExpenses;
  const participants = list.reduce((s, e) => s + (Number(e.participants) || 0), 0);
  const occRates = list.map(calcOccupancy).filter((v) => v !== null);
  const avgOccupancy = occRates.length ? occRates.reduce((s, v) => s + v, 0) / occRates.length : null;
  const profitable = list.filter((e) => calcProfit(e) > 0).length;
  const unprofitable = list.filter((e) => calcProfit(e) < 0).length;
  const margin = totalRevenue === 0 ? null : (profit / totalRevenue) * 100;
  return { totalRevenue, totalExpenses, profit, participants, avgOccupancy, profitable, unprofitable, margin };
}

function groupByClass(list) {
  const map = new Map();
  list.forEach((r) => {
    if (!map.has(r.className)) map.set(r.className, []);
    map.get(r.className).push(r);
  });
  return map;
}

function latestMonthOf(list) {
  if (!list.length) return null;
  return [...list].sort((a, b) => (b.year * 100 + b.month) - (a.year * 100 + a.month))[0];
}

/* ============================================================
   ダッシュボード（5〜6章）
   ============================================================ */

function DashboardPage({ records, filteredRecords, filters, setFilters, allClassNames, allInstructors, allFiscalYears, onSelectClass, onAdd }) {
  const totals = aggregateTotals(filteredRecords);
  const byClass = groupByClass(filteredRecords);

  // 前月比較用：フィルターされた月が単一の場合のみ意味を持つが、常に「最新月 vs その前月」で比較する
  const sortedMonths = Array.from(new Set(filteredRecords.map((r) => r.year * 100 + r.month))).sort((a, b) => b - a);
  const latestKey = sortedMonths[0];
  const prevKey = sortedMonths[1];
  const latestList = filteredRecords.filter((r) => r.year * 100 + r.month === latestKey);
  const prevList = prevKey ? filteredRecords.filter((r) => r.year * 100 + r.month === prevKey) : [];
  const latestTotals = latestList.length ? aggregateTotals(latestList) : null;
  const prevTotals = prevList.length ? aggregateTotals(prevList) : null;

  const rankings = Array.from(byClass.entries()).map(([name, list]) => {
    const t = aggregateTotals(list);
    const last = latestMonthOf(list);
    return { name, ...t, last };
  });
  const byProfit = [...rankings].sort((a, b) => b.profit - a.profit);
  const byRevenue = [...rankings].sort((a, b) => b.totalRevenue - a.totalRevenue);

  const chartData = useMemo(() => {
    const map = new Map();
    filteredRecords.forEach((r) => {
      const key = `${r.year}-${String(r.month).padStart(2, "0")}`;
      if (!map.has(key)) map.set(key, { key, month: r.month, participants: 0, revenue: 0, profit: 0, occSum: 0, occN: 0 });
      const row = map.get(key);
      row.participants += Number(r.participants) || 0;
      row.revenue += calcTotalRevenue(r);
      row.profit += calcProfit(r);
      const occ = calcOccupancy(r);
      if (occ !== null) { row.occSum += occ; row.occN += 1; }
    });
    return Array.from(map.values())
      .sort((a, b) => a.key.localeCompare(b.key))
      .map((r) => ({ ...r, label: monthLabel(r.month), avgOcc: r.occN ? r.occSum / r.occN : null }));
  }, [filteredRecords]);

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl font-bold text-slate-900">ダッシュボード</h1>
          <p className="text-sm text-slate-500 mt-0.5">教室事業の収支状況を一目で確認できます。</p>
        </div>
        <button onClick={onAdd} className="inline-flex items-center gap-1.5 bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2 rounded-lg">
          <PlusCircle size={16} /> データ入力
        </button>
      </div>

      <FilterBar filters={filters} setFilters={setFilters} allClassNames={allClassNames} allInstructors={allInstructors} allFiscalYears={allFiscalYears} />

      {filteredRecords.length === 0 ? (
        <div className="text-center py-16 text-slate-400 text-sm bg-white rounded-xl border border-slate-200">該当するデータがありません。</div>
      ) : (
        <>
          {/* KPIカード */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <KpiCard label="今月の売上" value={yen(totals.totalRevenue)} icon={TrendingUp} accent="indigo" />
            <KpiCard label="今月の支出" value={yen(totals.totalExpenses)} icon={TrendingDown} accent="slate" />
            <KpiCard label="今月の利益" value={yen(totals.profit)} icon={totals.profit >= 0 ? TrendingUp : TrendingDown} accent={totals.profit >= 0 ? "emerald" : "rose"} />
            <KpiCard label="利益率" value={pct(totals.margin)} icon={BarChart3} accent="amber" />
            <KpiCard label="総参加人数" value={`${totals.participants.toLocaleString("ja-JP")}人`} icon={ListChecks} accent="indigo" />
            <KpiCard label="平均定員充足率" value={pct(totals.avgOccupancy)} icon={SlidersHorizontal} accent="slate" />
            <KpiCard label="黒字教室数" value={`${totals.profitable}教室`} icon={CheckCircle2} accent="emerald" />
            <KpiCard label="赤字教室数" value={`${totals.unprofitable}教室`} icon={AlertTriangle} accent="rose" />
          </div>

          {/* 前月比較 */}
          {latestTotals && prevTotals && (
            <div className="bg-white rounded-xl border border-slate-200 p-4">
              <h2 className="text-sm font-bold text-slate-800 mb-3">前月比較（{monthLabel(latestList[0].month)} と {monthLabel(prevList[0].month)}）</h2>
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-center">
                {[
                  { label: "売上", cur: latestTotals.totalRevenue, prev: prevTotals.totalRevenue },
                  { label: "支出", cur: latestTotals.totalExpenses, prev: prevTotals.totalExpenses },
                  { label: "利益", cur: latestTotals.profit, prev: prevTotals.profit },
                  { label: "参加人数", cur: latestTotals.participants, prev: prevTotals.participants },
                ].map((row) => {
                  const change = row.prev !== 0 ? ((row.cur - row.prev) / Math.abs(row.prev)) * 100 : null;
                  return (
                    <div key={row.label} className="flex flex-col items-center gap-1 py-1">
                      <span className="text-xs text-slate-500">{row.label}</span>
                      <ChangeTag value={change} />
                    </div>
                  );
                })}
                <div className="flex flex-col items-center gap-1 py-1">
                  <span className="text-xs text-slate-500">定員充足率</span>
                  <ChangeTag value={latestTotals.avgOccupancy !== null && prevTotals.avgOccupancy !== null ? latestTotals.avgOccupancy - prevTotals.avgOccupancy : null} isPoint />
                </div>
              </div>
            </div>
          )}

          {/* グラフ */}
          <div className="grid md:grid-cols-2 gap-4">
            <ChartCard title="参加人数の推移">
              <ResponsiveContainer width="100%" height={220}>
                <LineChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="label" tick={{ fontSize: 12 }} />
                  <YAxis tick={{ fontSize: 12 }} />
                  <Tooltip formatter={(v) => [`${v}人`, "参加人数"]} />
                  <Line type="monotone" dataKey="participants" stroke="#0f766e" strokeWidth={2} dot={{ r: 3 }} />
                </LineChart>
              </ResponsiveContainer>
            </ChartCard>
            <ChartCard title="売上の推移">
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="label" tick={{ fontSize: 12 }} />
                  <YAxis tick={{ fontSize: 12 }} tickFormatter={(v) => `${Math.round(v/1000)}k`} />
                  <Tooltip formatter={(v) => [yen(v), "売上"]} />
                  <Bar dataKey="revenue" fill="#6366f1" radius={[4,4,0,0]} />
                </BarChart>
              </ResponsiveContainer>
            </ChartCard>
            <ChartCard title="利益の推移">
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="label" tick={{ fontSize: 12 }} />
                  <YAxis tick={{ fontSize: 12 }} tickFormatter={(v) => `${Math.round(v/1000)}k`} />
                  <Tooltip formatter={(v) => [yen(v), "利益"]} />
                  <ReferenceLine y={0} stroke="#94a3b8" />
                  <Bar dataKey="profit" radius={[4,4,0,0]}>
                    {chartData.map((d, i) => <Cell key={i} fill={d.profit >= 0 ? "#10b981" : "#f43f5e"} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </ChartCard>
            <ChartCard title="定員充足率の推移">
              <ResponsiveContainer width="100%" height={220}>
                <LineChart data={chartData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="label" tick={{ fontSize: 12 }} />
                  <YAxis tick={{ fontSize: 12 }} domain={[0, 100]} />
                  <Tooltip formatter={(v) => [`${v.toFixed(0)}%`, "定員充足率"]} />
                  <Line type="monotone" dataKey="avgOcc" stroke="#d97706" strokeWidth={2} dot={{ r: 3 }} />
                </LineChart>
              </ResponsiveContainer>
            </ChartCard>
          </div>

          {/* ランキング */}
          <div className="grid md:grid-cols-2 gap-4">
            <RankingCard title="利益ランキング" rows={byProfit} valueFn={(r) => yen(r.profit)} onSelect={onSelectClass} />
            <RankingCard title="売上ランキング" rows={byRevenue} valueFn={(r) => yen(r.totalRevenue)} onSelect={onSelectClass} />
          </div>
        </>
      )}
    </div>
  );
}

function ChartCard({ title, children }) {
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-4">
      <h3 className="text-sm font-bold text-slate-800 mb-2">{title}</h3>
      {children}
    </div>
  );
}

function RankingCard({ title, rows, valueFn, onSelect }) {
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-4">
      <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5"><Trophy size={15} className="text-amber-500" />{title}</h3>
      <div className="flex flex-col divide-y divide-slate-100">
        {rows.slice(0, 5).map((r, i) => (
          <button key={r.name} onClick={() => onSelect(r.name)} className="flex items-center justify-between py-2.5 text-left hover:bg-slate-50 -mx-1 px-1 rounded-md">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${i === 0 ? "bg-amber-100 text-amber-700" : "bg-slate-100 text-slate-500"}`}>{i+1}</span>
              <span className="text-sm text-slate-800 truncate">{r.name}</span>
            </div>
            <span className="text-sm font-semibold text-slate-900 tabular-nums shrink-0 ml-2">{valueFn(r)}</span>
          </button>
        ))}
        {rows.length === 0 && <div className="text-sm text-slate-400 py-4 text-center">データがありません</div>}
      </div>
    </div>
  );
}

    if (form.participationFee === "" || Number(form.participationFee) < 0) e.participationFee = "参加費は0以上の数字を入力してください。";

            <div className="mt-3 flex flex-col gap-2">

function Row({ label, value, strong, color }) {

    <div className="flex items-center justify-between">

/* ============================================================
   分析ページ（10〜15章）
   ============================================================ */

function AnalysisPage({ records, filteredRecords, filters, setFilters, allClassNames, allInstructors, allFiscalYears }) {
  const byClass = groupByClass(filteredRecords);
  const monthKeys = Array.from(new Set(filteredRecords.map((r) => r.year * 100 + r.month))).sort((a, b) => a - b);

  const analysisItems = [];
  const improvementItems = [];

  byClass.forEach((list, name) => {
    const sorted = [...list].sort((a, b) => (a.year*100+a.month) - (b.year*100+b.month));
    const latest = sorted[sorted.length - 1];
    const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
    if (!latest) return;
    analysisItems.push(...buildAutoAnalysis(records, latest, prev));

    // 継続減少の判定
    let streak = 0;
    for (let i = sorted.length - 1; i > 0; i--) {
      if ((Number(sorted[i].participants)||0) < (Number(sorted[i-1].participants)||0)) streak++;
      else break;
    }
    improvementItems.push({ name, points: buildImprovementPoints(latest, streak) });
  });

  return (
    <div className="flex flex-col gap-5">
      <div>
        <h1 className="text-xl font-bold text-slate-900">分析</h1>
        <p className="text-sm text-slate-500 mt-0.5">教室ごとのランキング・自動分析・改善ポイントを確認できます。</p>
      </div>
      <FilterBar filters={filters} setFilters={setFilters} allClassNames={allClassNames} allInstructors={allInstructors} allFiscalYears={allFiscalYears} />

      {/* ランキング4種 */}
      <div className="grid md:grid-cols-2 gap-4">
        <RankingFull title="売上ランキング" byClass={byClass} keyFn={(t) => t.totalRevenue} fmt={yen} />
        <RankingFull title="利益ランキング" byClass={byClass} keyFn={(t) => t.profit} fmt={yenSigned} />
        <RankingFull title="参加人数ランキング" byClass={byClass} keyFn={(t) => t.participants} fmt={(v) => `${v}人`} />
        <RankingFull title="定員充足率ランキング" byClass={byClass} keyFn={(t) => t.avgOccupancy ?? -1} fmt={(v) => pct(v)} />
      </div>

      {/* 自動分析 */}
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5"><Sparkles size={15} className="text-indigo-500" />自動分析コメント</h3>
        {analysisItems.length === 0 ? (
          <div className="text-sm text-slate-400 py-4 text-center">特筆すべき変化は検出されませんでした。</div>
        ) : (
          <ul className="flex flex-col gap-2">
            {analysisItems.map((t, i) => (
              <li key={i} className="text-sm text-slate-700 bg-indigo-50 rounded-lg px-3 py-2 flex items-start gap-2">
                <Info size={14} className="text-indigo-500 mt-0.5 shrink-0" /> {t}
              </li>
            ))}
          </ul>
        )}
      </div>

      {/* 改善ポイント */}
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <h3 className="text-sm font-bold text-slate-800 mb-3">改善ポイント</h3>
        <div className="flex flex-col gap-3">
          {improvementItems.filter((i) => i.points.length > 0).map((item) => (
            <div key={item.name} className="border border-slate-100 rounded-lg p-3">
              <div className="text-sm font-semibold text-slate-800 mb-1.5">{item.name}</div>
              <ul className="flex flex-col gap-1.5">
                {item.points.map((p, i) => (
                  <li key={i} className={`text-xs rounded-md px-2.5 py-1.5 flex items-start gap-1.5 ${
                    p.type === "good" ? "bg-emerald-50 text-emerald-700" : p.type === "bad" ? "bg-rose-50 text-rose-700" : "bg-amber-50 text-amber-700"
                  }`}>
                    {p.type === "good" ? <CheckCircle2 size={13} className="mt-0.5 shrink-0" /> : <AlertTriangle size={13} className="mt-0.5 shrink-0" />}
                    {p.text}
                  </li>
                ))}
              </ul>
            </div>
          ))}
          {improvementItems.every((i) => i.points.length === 0) && (
            <div className="text-sm text-slate-400 py-4 text-center">現時点で改善提案はありません。</div>
          )}
        </div>
        <p className="text-[11px] text-slate-400 mt-3">※ これらは参考提案であり、断定的な結論ではありません。</p>
      </div>
    </div>
  );
}

function RankingFull({ title, byClass, keyFn, fmt }) {
  const rows = Array.from(byClass.entries()).map(([name, list]) => ({ name, t: aggregateTotals(list) }))
    .sort((a, b) => keyFn(b.t) - keyFn(a.t));
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-4">
      <h3 className="text-sm font-bold text-slate-800 mb-3">{title}</h3>
      <div className="flex flex-col divide-y divide-slate-100">
        {rows.map((r, i) => (
          <div key={r.name} className="flex items-center justify-between py-2 text-sm">
            <div className="flex items-center gap-2 min-w-0">
              <span className="text-xs font-bold text-slate-400 w-5">{i+1}位</span>
              <span className="truncate text-slate-800">{r.name}</span>
            </div>
            <span className="font-semibold tabular-nums text-slate-900 shrink-0">{fmt(keyFn(r.t))}</span>
          </div>
        ))}
        {rows.length === 0 && <div className="text-sm text-slate-400 py-4 text-center">データがありません</div>}
      </div>
    </div>
  );
}

function SimulationPage({ records, allClassNames }) {
  const [targetClass, setTargetClass] = useState(allClassNames[0] || "");
  const baseRecord = useMemo(() => {
    const list = records.filter((r) => r.className === targetClass).sort((a,b) => (b.year*100+b.month)-(a.year*100+a.month));
    return list[0] || null;
  }, [records, targetClass]);

  const [sim, setSim] = useState({ participants: 0, participationFee: 0, instructorFee: 0, otherExpense: 0 });

  useEffect(() => {
    if (baseRecord) {
      setSim({
        participants: baseRecord.participants,
        participationFee: baseRecord.participationFee,
        instructorFee: baseRecord.instructorFee,
        otherExpense: calcTotalExpenses(baseRecord) - baseRecord.instructorFee,
      });
    }
  }, [baseRecord]);

  const [scenarios, setScenarios] = useState([]);

  if (!baseRecord) {
    return <div className="text-sm text-slate-400">シミュレーションには少なくとも1件のデータが必要です。</div>;
  }

  const simEntry = {
    ...baseRecord,
    participants: Number(sim.participants) || 0,
    participationFee: Number(sim.participationFee) || 0,
    instructorFee: Number(sim.instructorFee) || 0,
    venueCost: baseRecord.venueCost, materialCost: baseRecord.materialCost, advertisingCost: baseRecord.advertisingCost, equipmentCost: baseRecord.equipmentCost,
    otherExpense: Number(sim.otherExpense) || 0,
    customExpenses: [],
  };

  const curRevenue = calcTotalRevenue(baseRecord);
  const curExpenses = calcTotalExpenses(baseRecord);
  const curProfit = curRevenue - curExpenses;

  const simRevenue = calcTotalRevenue(simEntry);
  const simExpenses = calcTotalExpenses(simEntry);
  const simProfit = simRevenue - simExpenses;
  const diff = simProfit - curProfit;
  const participantDiff = simEntry.participants - baseRecord.participants;

  const saveScenario = () => {
    setScenarios((s) => [...s, {
      id: uid(), label: `案${String.fromCharCode(65 + s.length)}`,
      participants: simEntry.participants, participationFee: simEntry.participationFee,
      profit: simProfit, revenue: simRevenue, expenses: simExpenses,
    }]);
  };

  const num = "w-full accent-teal-700";

  return (
    <div className="flex flex-col gap-5">
      <div>
        <h1 className="text-xl font-bold text-slate-900">収益シミュレーション</h1>
        <p className="text-sm text-slate-500 mt-0.5">参加人数・参加費・経費を変えたときの収支をリアルタイムに試算します。</p>
      </div>

      <div className="flex items-center gap-2">
        <span className="text-sm font-medium text-slate-600">対象教室：</span>
        <select className={inputCls + " max-w-xs"} value={targetClass} onChange={(e) => setTargetClass(e.target.value)}>
          {allClassNames.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-slate-200 p-4 flex flex-col gap-4">
          <h3 className="text-sm font-bold text-slate-800">条件を変更</h3>
          <div className="flex flex-col gap-3">
            <div>
              <div className="flex justify-between text-xs text-slate-500 mb-1"><span>想定参加人数</span><span className="font-semibold text-slate-800 tabular-nums">{sim.participants}人</span></div>
              <input type="range" min="0" max={Math.max(baseRecord.capacity * 1.2, 10)} className={num} value={sim.participants} onChange={(e) => setSim((s) => ({ ...s, participants: Number(e.target.value) }))} />
            </div>
            <div>
              <div className="flex justify-between text-xs text-slate-500 mb-1"><span>参加費</span><span className="font-semibold text-slate-800 tabular-nums">{yen(sim.participationFee)}</span></div>
              <input type="range" min="0" max={Math.max(baseRecord.participationFee * 2, 1000)} step="100" className={num} value={sim.participationFee} onChange={(e) => setSim((s) => ({ ...s, participationFee: Number(e.target.value) }))} />
            </div>
            <div>
              <div className="flex justify-between text-xs text-slate-500 mb-1"><span>講師謝金</span><span className="font-semibold text-slate-800 tabular-nums">{yen(sim.instructorFee)}</span></div>
              <input type="range" min="0" max={Math.max(baseRecord.instructorFee * 2, 5000)} step="500" className={num} value={sim.instructorFee} onChange={(e) => setSim((s) => ({ ...s, instructorFee: Number(e.target.value) }))} />
            </div>
            <div>
              <div className="flex justify-between text-xs text-slate-500 mb-1"><span>その他経費（会場費等含む）</span><span className="font-semibold text-slate-800 tabular-nums">{yen(sim.otherExpense)}</span></div>
              <input type="range" min="0" max={Math.max(sim.otherExpense * 2, 5000)} step="500" className={num} value={sim.otherExpense} onChange={(e) => setSim((s) => ({ ...s, otherExpense: Number(e.target.value) }))} />
            </div>
          </div>
          <button onClick={saveScenario} className="self-start text-xs font-semibold text-teal-700 hover:underline">この条件をシナリオとして保存</button>
        </div>

        <div className="bg-white rounded-xl border border-slate-200 p-4 flex flex-col gap-4">
          <h3 className="text-sm font-bold text-slate-800">試算結果</h3>
          <div className="grid grid-cols-2 gap-3">
            <MiniCompare label="売上" cur={curRevenue} sim={simRevenue} fmt={yen} />
            <MiniCompare label="支出" cur={curExpenses} sim={simExpenses} fmt={yen} />
            <MiniCompare label="利益" cur={curProfit} sim={simProfit} fmt={yenSigned} />
            <MiniCompare label="利益率" cur={calcProfitMargin(baseRecord)} sim={calcProfitMargin(simEntry)} fmt={pct} />
          </div>
          <div className={`rounded-lg px-3 py-3 text-sm font-medium ${diff >= 0 ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800"}`}>
            {participantDiff !== 0
              ? `参加者を${participantDiff > 0 ? participantDiff + "人増やす" : Math.abs(participantDiff) + "人減らす"}と、利益が${diff >= 0 ? Math.abs(diff).toLocaleString("ja-JP") + "円改善" : Math.abs(diff).toLocaleString("ja-JP") + "円悪化"}します。`
              : `現在の条件からの利益変化：${yenSigned(diff)}`}
          </div>
        </div>
      </div>

      {scenarios.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-200 p-4">
          <h3 className="text-sm font-bold text-slate-800 mb-3">シナリオ比較</h3>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="text-slate-500 text-xs">
                <tr>
                  <th className="text-left px-3 py-2">シナリオ</th>
                  <th className="text-right px-3 py-2">参加人数</th>
                  <th className="text-right px-3 py-2">参加費</th>
                  <th className="text-right px-3 py-2">売上</th>
                  <th className="text-right px-3 py-2">利益</th>
                  <th className="px-3 py-2"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                <tr className="bg-slate-50 font-medium">
                  <td className="px-3 py-2">現状</td>
                  <td className="px-3 py-2 text-right tabular-nums">{baseRecord.participants}人</td>
                  <td className="px-3 py-2 text-right tabular-nums">{yen(baseRecord.participationFee)}</td>
                  <td className="px-3 py-2 text-right tabular-nums">{yen(curRevenue)}</td>
                  <td className={`px-3 py-2 text-right tabular-nums font-semibold ${curProfit>=0?"text-emerald-700":"text-rose-700"}`}>{yenSigned(curProfit)}</td>
                  <td></td>
                </tr>
                {scenarios.map((s) => (
                  <tr key={s.id}>
                    <td className="px-3 py-2">{s.label}</td>
                    <td className="px-3 py-2 text-right tabular-nums">{s.participants}人</td>
                    <td className="px-3 py-2 text-right tabular-nums">{yen(s.participationFee)}</td>
                    <td className="px-3 py-2 text-right tabular-nums">{yen(s.revenue)}</td>
                    <td className={`px-3 py-2 text-right tabular-nums font-semibold ${s.profit>=0?"text-emerald-700":"text-rose-700"}`}>{yenSigned(s.profit)}</td>
                    <td className="px-3 py-2 text-right">
                      <button onClick={() => setScenarios((arr) => arr.filter((x) => x.id !== s.id))} className="text-slate-400 hover:text-rose-500"><X size={14} /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function MiniCompare({ label, cur, sim, fmt }) {
  return (
    <div className="rounded-lg bg-slate-50 p-3">
      <div className="text-xs text-slate-500 mb-1">{label}</div>
      <div className="flex items-baseline gap-2">
        <span className="text-[11px] text-slate-400 line-through tabular-nums">{fmt(cur)}</span>
        <span className="text-sm font-bold text-slate-900 tabular-nums">{fmt(sim)}</span>
      </div>
    </div>
  );
}

/* ============================================================
   設定（CSVインポート/エクスポート・20〜21章）
   ============================================================ */

const CSV_HEADERS = [
  "className","category","year","month","instructor","capacity","numberOfSessions",
  "participationFee","participants","otherRevenue",
  "instructorFee","venueCost","materialCost","advertisingCost","equipmentCost","otherExpense","notes",
];

function toCsv(records) {
  const lines = [CSV_HEADERS.join(",")];
  records.forEach((r) => {
    const row = CSV_HEADERS.map((h) => {
      let v = r[h] ?? "";
      v = String(v).replace(/"/g, '""');
      if (v.includes(",") || v.includes("\n")) v = `"${v}"`;
      return v;
    });
    lines.push(row.join(","));
  });
  return lines.join("\n");
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim() !== "");
  if (lines.length === 0) return { rows: [], errors: ["ファイルが空です。"] };
  const headers = lines[0].split(",").map((h) => h.trim());
  const rows = [];
  const errors = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(",");
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (cols[idx] ?? "").trim(); });
    if (!obj.className) { errors.push(`${i + 1}行目：教室名が空です。`); continue; }
    const participants = Number(obj.participants);
    if (obj.participants !== undefined && (Number.isNaN(participants) || participants < 0)) {
      errors.push(`${i + 1}行目の参加人数が不正です。`); continue;
    }
    const capacity = Number(obj.capacity || 0);
    if (Number.isNaN(capacity) || capacity < 0) { errors.push(`${i + 1}行目の定員が不正です。`); continue; }
    rows.push({
      id: uid(),
      className: obj.className, category: obj.category || "その他",
      year: Number(obj.year) || 2026, month: Number(obj.month) || 4,
      instructor: obj.instructor || "", capacity, numberOfSessions: Number(obj.numberOfSessions) || 0,
      date: "", dayOfWeek: "土", startTime: "10:00", endTime: "11:00",
      participationFee: Number(obj.participationFee) || 0, participants,
      otherRevenue: Number(obj.otherRevenue) || 0,
      instructorFee: Number(obj.instructorFee) || 0, venueCost: Number(obj.venueCost) || 0,
      materialCost: Number(obj.materialCost) || 0, advertisingCost: Number(obj.advertisingCost) || 0,
      equipmentCost: Number(obj.equipmentCost) || 0, otherExpense: Number(obj.otherExpense) || 0,
      customExpenses: [], notes: obj.notes || "",
    });
  }
  return { rows, errors };
}

function SettingsPage({ records, onImport, onClearAll }) {
  const [importErrors, setImportErrors] = useState([]);
  const [importSuccess, setImportSuccess] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);

  const handleExport = () => {
    const csv = toCsv(records);
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `教室データ_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleSampleDownload = () => {
    const sampleCsv = CSV_HEADERS.join(",") + "\n" +
      "フットサル教室,スポーツ教室,2026,4,田中コーチ,20,4,3000,12,0,8000,6000,0,0,0,0,サンプルデータ";
    const blob = new Blob(["\uFEFF" + sampleCsv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "サンプルフォーマット.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  const handleFile = (file) => {
    setImportErrors([]); setImportSuccess(null);
    const reader = new FileReader();
    reader.onload = () => {
      const { rows, errors } = parseCsv(String(reader.result));
      if (rows.length > 0) {
        onImport((prev) => [...prev, ...rows]);
        setImportSuccess(`${rows.length}件のデータを取り込みました。`);
      }
      if (errors.length > 0) setImportErrors(errors);
    };
    reader.readAsText(file, "UTF-8");
  };

  return (
    <div className="flex flex-col gap-5 max-w-2xl">
      <div>
        <h1 className="text-xl font-bold text-slate-900">設定</h1>
        <p className="text-sm text-slate-500 mt-0.5">データのエクスポート・インポート、その他の設定を行います。</p>
      </div>

      <SectionCard title="CSVエクスポート">
        <p className="text-sm text-slate-500 mb-3">登録されている全教室データをCSV形式でダウンロードします。</p>
        <button onClick={handleExport} className="inline-flex items-center gap-1.5 bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-4 py-2 rounded-lg">
          <Download size={15} /> CSVエクスポート
        </button>
      </SectionCard>

      <SectionCard title="CSVインポート">
        <p className="text-sm text-slate-500 mb-3">CSVファイルから教室データを取り込みます。既存データに追加されます。</p>
        <div className="flex items-center gap-3 flex-wrap">
          <label className="inline-flex items-center gap-1.5 border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg cursor-pointer">
            <Upload size={15} /> ファイルを選択
            <input type="file" accept=".csv" className="hidden" onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
          </label>
          <button onClick={handleSampleDownload} className="text-xs font-semibold text-teal-700 hover:underline">サンプルフォーマットをダウンロード</button>
        </div>
        {importSuccess && <div className="mt-3 text-sm text-emerald-700 bg-emerald-50 rounded-lg px-3 py-2">{importSuccess}</div>}
        {importErrors.length > 0 && (
          <div className="mt-3 text-sm text-rose-700 bg-rose-50 rounded-lg px-3 py-2 flex flex-col gap-1">
            {importErrors.map((e, i) => <div key={i}>{e}</div>)}
          </div>
        )}
      </SectionCard>

      <SectionCard title="データ管理">
        <p className="text-sm text-slate-500 mb-3">現在 {records.length} 件のデータが登録されています。</p>
        <button onClick={() => setConfirmClear(true)} className="inline-flex items-center gap-1.5 border border-rose-300 text-rose-600 hover:bg-rose-50 text-sm font-semibold px-4 py-2 rounded-lg">
          <Trash2 size={15} /> 全データを削除
        </button>
      </SectionCard>

      {confirmClear && (
        <ConfirmModal
          message="すべてのデータを削除しますか？"
          detail="この操作は取り消せません。"
          onCancel={() => setConfirmClear(false)}
          onConfirm={() => { onClearAll(); setConfirmClear(false); }}
        />
      )}
    </div>
  );
}
